# Column-level tests for the gold layer.
version: 2

models:
  - name: gold_account_features
    description: "One row per account: counts, fan-in/fan-out and totals over the whole period."
    columns:
      - name: account_key
        tests:
          - unique       # exactly one row per account
          - not_null
      - name: fan_out
        tests:
          - not_null
      - name: fan_in
        tests:
          - not_null

  - name: gold_transaction_flags
    description: "One row per transaction: rule flags and the time split (train/validation/test)."
    columns:
      - name: raw_row_id
        tests:
          - unique
          - not_null
      - name: split
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['train', 'validation', 'test']
      - name: rules_fired
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2]
