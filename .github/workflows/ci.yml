# CI: on every push, GitHub rebuilds the pipeline on synthetic data and runs all tests.
# Uses NO real data and NO secrets.
name: CI

on:                                  # WHEN to run
  push:                              # on every push to any branch
  pull_request:                      # and on pull requests

jobs:
  dbt-build:                         # one job, named dbt-build
    runs-on: ubuntu-latest           # a fresh Linux machine provided by GitHub

    steps:
      - name: Get the code
        uses: actions/checkout@v4    # copies the repository onto the machine

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # same version we use locally

      - name: Install packages
        run: pip install -r requirements.txt     # the exact versions we froze earlier

      - name: Generate synthetic sample data
        run: python scripts/make_sample_data.py  # 2,000 fake rows; the real IBM data is never used here

      - name: Build models and run tests
        working-directory: dbt                   # run the next command inside the dbt/ folder
        run: |
          dbt build --target ci --vars '{raw_trans_path: ../data/sample/sample_trans.csv}'
        # "run: |" = everything indented below is plain text, so the colon in the vars is not read as YAML
        # dbt build = run all models AND all tests; the job turns red if any test fails
